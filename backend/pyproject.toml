[build-system]
requires = ["setuptools>=75,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-assistance-backend"
version = "0.1.0"
description = "Infrastructure foundation for the Voice Assistance project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "PyJWT>=2.10,<3",
    "pgvector>=0.3.6,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "redis>=5.2,<6",
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
whisper = [
    "ctranslate2>=4,<5",
    "faster-whisper>=1.2,<2",
    "numpy>=2,<3",
]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "numpy>=2,<3",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires running PostgreSQL and Redis infrastructure",
    "slow_stt_gateway: exercises cancellation during delayed STT inference",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
