name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://voice:voice@localhost:5432/voice_assistance
      REDIS_URL: redis://localhost:6379/0
      RUN_INTEGRATION_TESTS: '1'
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: voice_assistance
          POSTGRES_USER: voice
          POSTGRES_PASSWORD: voice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice -d voice_assistance"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        run: python -m pip install -e "backend[dev]"
      - name: Run migrations
        working-directory: backend
        run: alembic upgrade head
      - name: Backend lint
        working-directory: backend
        run: ruff check .
      - name: Backend format check
        working-directory: backend
        run: ruff format --check .
      - name: Backend tests
        working-directory: backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Prettier
        run: npm run format:check
      - name: Jest
        run: npm test -- --runInBand
